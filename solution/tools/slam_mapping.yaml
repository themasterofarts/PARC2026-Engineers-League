# Overrides on top of slam_toolbox's built-in defaults for building the cafe
# map (see build_map.py). Only values that differ from the defaults are set.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    # IMU-heading-corrected odometry (see imu_odom_corrector.py); raw
    # wheel odometry overestimates turns by ~30% and breaks scan matching.
    odom_frame: odom_imu
    map_frame: map
    base_frame: base_footprint
    # Pre-filtered by scan_filter.yaml (self-hits removed), see build_map.py.
    scan_topic: /scan_filtered
    resolution: 0.05
    # The RPLIDAR C1 sees the robot's own chassis out to ~0.29m (see the
    # obstacle_min_range comment in nav2_params.yaml); without this those
    # returns get baked into the map along the whole driven path.
    min_laser_range: 0.35
    max_laser_range: 12.0
    map_update_interval: 2.0
    # Place every scan at the odometry pose instead of scan-matching it.
    # odom_imu is accurate enough on its own (drift check at the end of a
    # build: 0.00 m / -0.5 deg vs Gazebo ground truth), while slam_toolbox's
    # matching dragged the map 2.9 m / -17.5 deg off and tilted the cafe.
    use_scan_matching: false
    do_loop_closing: false
