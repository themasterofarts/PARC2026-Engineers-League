# Nav2 configuration for the PARC 2026 navigation task: navigation on our own
# map of the cafe (maps/cafe.yaml, built with tools/build_map.py), as the
# Engineers League coordinator requires.
#
# Frame chain: map -> odom_imu -> odom -> base_footprint.
#  - map -> odom_imu: AMCL, localizing the LiDAR scan against the map.
#  - odom_imu -> odom: imu_odom_corrector. Wheel odometry overestimates every
#    turn by ~31%, so the IMU's heading replaces it (see imu_odom_corrector.py);
#    AMCL then only has to absorb small errors.
#  - odom -> base_footprint: the simulator's wheel odometry.
# The map's origin is the robot's spawn pose (slam_toolbox starts its map
# frame there), so task_solution.py converts the world-frame goal with the
# inverse spawn pose and sends it in "map".
# /odom is still the velocity source (odom_topic): its speeds are accurate.
#
# nav2_params_mapping.yaml overrides the map-dependent parts when building the
# map (no map yet: rolling costmaps in odom_imu, slam_toolbox instead of AMCL).

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml is set in launch/nav2_bringup.launch.py (it
    # needs the installed path): behavior_trees/navigate_to_pose_no_motion_recovery.xml,
    # the stock tree without the Spin/BackUp recoveries. Don't set it to ""
    # here: that loads an empty tree and every goal fails immediately.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      # The task only gives a goal position (goal_x/goal_y), no orientation,
      # so any final heading is fine. Requiring one made the robot circle the
      # goal: the controller doesn't pivot in place, so when it arrives at the
      # wrong angle it loops around to re-approach (0.15 rad circled every
      # time; 0.4 rad still looped when the map route arrived at a new angle).
      yaw_goal_tolerance: 3.14
      stateful: true

    # Tuned for speed after measuring the robot directly: commanding
    # cmd_vel linear.x=1.0 achieved a clean, unclipped 1.0 m/s in /odom (no
    # hardware-level cap in this range), so the original ~6:42 run was
    # bottlenecked entirely by conservative controller tuning — mainly
    # desired_linear_vel=0.4, a velocity_smoother cap of 0.5 m/s, and
    # use_rotate_to_heading stopping the robot to pivot in place on every
    # large heading error instead of arcing continuously.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      max_angular_accel: 3.0
      max_robot_pose_search_dist: 5.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # Disabled: with this on, the controller fully stops and pivots in
      # place whenever heading error exceeds rotate_to_heading_min_angle,
      # which is what stalled ~10s of "no distance progress" at the very
      # start of the original run. Off, it arcs continuously instead.
      use_rotate_to_heading: false
      max_angular_vel: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom_imu
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.25, 0.245], [0.25, -0.245], [-0.25, -0.245], [-0.25, 0.245]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          # The RPLIDAR C1 sees parts of the robot's own chassis at
          # several angles: ~0.05-0.11m (front/rear mount) and two
          # symmetric ~0.17-0.29m clusters (likely the wheels/chassis
          # sides) — that saturates the costmap with bogus close obstacles
          # and stalls the controller (RegulatedPurePursuitController
          # reports "collision ahead" forever). Ignore anything within
          # 0.35m of the lidar; a real obstacle that close is already
          # inside the footprint/inflation radius anyway.
          obstacle_min_range: 0.35
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      # Sized by the map (static_layer), not a rolling window.
      rolling_window: false
      resolution: 0.05
      footprint: "[[0.25, 0.245], [0.25, -0.245], [-0.25, -0.245], [-0.25, 0.245]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          # The RPLIDAR C1 sees parts of the robot's own chassis at
          # several angles: ~0.05-0.11m (front/rear mount) and two
          # symmetric ~0.17-0.29m clusters (likely the wheels/chassis
          # sides) — that saturates the costmap with bogus close obstacles
          # and stalls the controller (RegulatedPurePursuitController
          # reports "collision ahead" forever). Ignore anything within
          # 0.35m of the lidar; a real obstacle that close is already
          # inside the footprint/inflation radius anyway.
          obstacle_min_range: 0.35
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wider, slower-decaying inflation keeps NavFn's path further from
        # what the LiDAR sees of each cafe table (its 0.56m base plate): the
        # 0.913m tabletop overhangs that plate by ~0.18m at chassis height,
        # which the 2D costmap can't see directly.
        cost_scaling_factor: 1.5
        inflation_radius: 1.1
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom_imu
    local_frame: odom_imu
    robot_base_frame: base_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false

map_server:
  ros__parameters:
    use_sim_time: true
    # yaml_filename is set by nav2_bringup.launch.py (the installed maps/cafe.yaml).

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    # AMCL corrects on top of the IMU-corrected odometry, so it publishes
    # map -> odom_imu rather than map -> odom.
    odom_frame_id: odom_imu
    base_frame_id: base_footprint
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    # Same reason as obstacle_min_range: the LiDAR sees the robot's own
    # chassis out to ~0.29 m.
    laser_min_range: 0.35
    laser_max_range: 12.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    # odom_imu is already accurate (< 1 deg / ~1 % over the route), so tell
    # AMCL to trust it: with the default motion noise (alpha 0.2) its
    # correction wandered up to 0.95 m with 100+ jumps per run, shifting the
    # path under the robot, which then weaved (up to 22.7 m driven for a 12 m
    # route). Fewer, better-grounded updates too.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    update_min_d: 0.2
    update_min_a: 0.2
    transform_tolerance: 1.0
    tf_broadcast: true
    # The map's origin is the spawn pose, where the robot starts.
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
