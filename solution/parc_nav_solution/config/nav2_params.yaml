# Mapless Nav2 configuration for the PARC 2026 navigation task.
#
# No map_server/AMCL: task.launch.py provides no static map, so both
# costmaps run as rolling windows in an odometry frame instead of a "map"
# frame. That frame is odom_imu, not the simulator's odom: wheel odometry
# overestimates every turn by ~30%, so imu_odom_corrector (launched in
# nav2_bringup.launch.py) publishes odom_imu -> odom using the IMU's heading.
# /odom is still used as the velocity source (odom_topic), which is accurate.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom_imu
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml
    # intentionally left unset so bt_navigator falls back to its own
    # bundled default behavior trees (setting either to "" loads an empty
    # tree and every goal fails immediately).

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.4
      stateful: true

    # Tuned for speed after measuring the robot directly: commanding
    # cmd_vel linear.x=1.0 achieved a clean, unclipped 1.0 m/s in /odom (no
    # hardware-level cap in this range), so the original ~6:42 run was
    # bottlenecked entirely by conservative controller tuning — mainly
    # desired_linear_vel=0.4, a velocity_smoother cap of 0.5 m/s, and
    # use_rotate_to_heading stopping the robot to pivot in place on every
    # large heading error instead of arcing continuously.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      max_angular_accel: 3.0
      max_robot_pose_search_dist: 5.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # Disabled: with this on, the controller fully stops and pivots in
      # place whenever heading error exceeds rotate_to_heading_min_angle,
      # which is what stalled ~10s of "no distance progress" at the very
      # start of the original run. Off, it arcs continuously instead.
      use_rotate_to_heading: false
      max_angular_vel: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom_imu
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.25, 0.245], [0.25, -0.245], [-0.25, -0.245], [-0.25, 0.245]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          # The RPLIDAR C1 sees parts of the robot's own chassis at
          # several angles: ~0.05-0.11m (front/rear mount) and two
          # symmetric ~0.17-0.29m clusters (likely the wheels/chassis
          # sides) — that saturates the costmap with bogus close obstacles
          # and stalls the controller (RegulatedPurePursuitController
          # reports "collision ahead" forever). Ignore anything within
          # 0.35m of the lidar; a real obstacle that close is already
          # inside the footprint/inflation radius anyway.
          obstacle_min_range: 0.35
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom_imu
      robot_base_frame: base_footprint
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[[0.25, 0.245], [0.25, -0.245], [-0.25, -0.245], [-0.25, 0.245]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          # The RPLIDAR C1 sees parts of the robot's own chassis at
          # several angles: ~0.05-0.11m (front/rear mount) and two
          # symmetric ~0.17-0.29m clusters (likely the wheels/chassis
          # sides) — that saturates the costmap with bogus close obstacles
          # and stalls the controller (RegulatedPurePursuitController
          # reports "collision ahead" forever). Ignore anything within
          # 0.35m of the lidar; a real obstacle that close is already
          # inside the footprint/inflation radius anyway.
          obstacle_min_range: 0.35
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wider, slower-decaying inflation keeps NavFn's path further from
        # what the LiDAR sees of each cafe table (its 0.56m base plate): the
        # 0.913m tabletop overhangs that plate by ~0.18m at chassis height,
        # which the 2D costmap can't see directly.
        cost_scaling_factor: 1.5
        inflation_radius: 1.1
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom_imu
    local_frame: odom_imu
    robot_base_frame: base_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Was [0.5, ...] — silently clipping FollowPath's output back down
    # below its own desired_linear_vel even before the speed tuning above.
    # Matches the DiffDrive plugin's max_linear_velocity (1.5) / drops in a
    # small margin below it.
    max_velocity: [1.2, 0.0, 1.0]
    min_velocity: [-1.2, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
