##### Mission sur le vrai robot (topics de parc_ros2_topics_updated.md)
#    A verifier avec diagnostic_robot.py : camera du haut, secteur avant du LiDAR sans le chassis,
#    et que obstacle_avoidance ne publie pas aussi sur /botwheel_explorer/cmd_vel.
mission:
  ros__parameters:
    base_frame: base_link
    cmd_vel_topic: /botwheel_explorer/cmd_vel   # consigne des organisateurs (4 nov) : direct aux roues
    cmd_vel_stamped: true                       # TwistStamped sur ce topic
    scan_topic: /scan
    scan_filtered_topic: /scan_ma64       # notre laser_filter (robot.launch.py)
    image_topic: /camera2/camera2/color/image_raw   # remplace par l'argument camera du launch
    detections_topic: /detections
    # Regle (organisateur, 05/11) : le point du robot le plus proche du tag a ~0.5 m, jugee a l'oeil.
    # visit_distance est mesuree du CENTRE du robot : 0.60 - demi-longueur avant (~0.25) = avant a ~0.35 m.
    # A verifier au metre ruban sur le robot (guide, 3a).
    visit_distance: 0.60             # centre du robot -> face du tag
    visit_distance_tolerance: 0.05   # visite acceptee entre 0.55 et 0.65 m (mesure camera)
    view_distance: 1.2
    max_linear: 0.12
    max_angular: 0.5
    spin_speed: 0.4
    front_stop_distance: 0.25
    # le robot tourne autour de l'axe des roues (URDF : x = +0.095) : l'arriere du chassis (x = -0.288)
    # decrit un cercle de 0.44 m ; il touchait les obstacles en tournant sur place
    pivot_x: 0.095
    rayon_balayage: 0.46        # distance obstacle -> axe des roues necessaire pour tourner sur place
    degagement_min: 0.30        # obstacle plus pres que ca : on s'ecarte avant de partir
    footprint_half_length: 0.31
    footprint_half_width: 0.24
    explore_max_cost: 85          # inflation cost_scaling 1.0 : meme distance aux obstacles qu'avant
    tag_budget_min: 60.0
    journal_dir: ~/teams/MA64/journaux
