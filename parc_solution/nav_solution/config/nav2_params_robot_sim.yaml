# GENERE par sim_outils/generer_config_sim.py depuis nav2_params_robot.yaml : ne pas modifier a la main.
# Simulateur officiel : base_footprint au lieu de base_link, use_sim_time, Twist sur /cmd_vel.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /botwheel_explorer/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'}
    navigate_through_poses: {plugin: 'nav2_bt_navigator::NavigateThroughPosesNavigator'}
    default_nav_to_pose_bt_xml: $(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /botwheel_explorer/odom
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath, DWBLocalPlanner]
    use_realtime_priority: false
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.5, movement_time_allowance: 10.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.25,
      yaw_goal_tolerance: 3.15}
    FollowPath: {plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController', desired_linear_vel: 0.25,
      max_angular_accel: 3.2, transform_tolerance: 0.2, lookahead_dist: 0.7, use_velocity_scaled_lookahead_dist: false,
      max_robot_pose_search_dist: 10.0, use_regulated_linear_velocity_scaling: true, regulated_linear_scaling_min_radius: 0.5,
      regulated_linear_scaling_min_speed: 0.1, use_cost_regulated_linear_velocity_scaling: true, inflation_cost_scaling_factor: 1.0,
      cost_scaling_dist: 0.6, cost_scaling_gain: 1.0, min_approach_linear_velocity: 0.05, approach_velocity_scaling_dist: 0.6,
      use_rotate_to_heading: true, rotate_to_heading_min_angle: 0.785, rotate_to_heading_angular_vel: 0.6, allow_reversing: false,
      use_collision_detection: true, max_allowed_time_to_collision_up_to_carrot: 1.0}
    DWBLocalPlanner:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.22
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.25
      PathAlign.scale: 30.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    enable_stamped_cmd_vel: false
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[-0.31, -0.24], [0.22, -0.24], [0.22, 0.24], [-0.31, 0.24]]'
      plugins: [obstacle_layer, hauts_layer, keepout_filter, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan camera2_scan
        scan: {topic: /scan_ma64, data_type: LaserScan, clearing: true, marking: true, obstacle_max_range: 3.0,
          obstacle_min_range: 0.32, raytrace_max_range: 3.6}
        camera2_scan: {topic: /camera1/scan, data_type: LaserScan, clearing: true, marking: true, max_obstacle_height: 2.0,
          min_obstacle_height: 0.0, obstacle_max_range: 2.5, obstacle_min_range: 0.0, raytrace_max_range: 3.0, raytrace_min_range: 0.0,
          inf_is_valid: false}
      hauts_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: hauts
        hauts: {topic: /ma64/obstacles_hauts, data_type: LaserScan, clearing: true, marking: true, min_obstacle_height: -0.1,
          max_obstacle_height: 2.0, obstacle_max_range: 2.4, raytrace_max_range: 2.5, inf_is_valid: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', inflation_radius: 0.8, cost_scaling_factor: 1.0}
      always_send_full_costmap: true
      keepout_filter: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true, filter_info_topic: /costmap_filter_info,
        transform_tolerance: 0.5}
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 5.0
      rolling_window: false
      width: 20
      height: 20
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[-0.31, -0.24], [0.22, -0.24], [0.22, 0.24], [-0.31, 0.24]]'
      plugins: [static_layer, obstacle_layer, hauts_layer, keepout_filter, inflation_layer]
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan camera2_scan
        scan: {topic: /scan_ma64, data_type: LaserScan, clearing: true, marking: true, min_obstacle_height: 0.0,
          max_obstacle_height: 0.3, obstacle_max_range: 3.5, raytrace_max_range: 6.0}
        camera2_scan: {topic: /camera1/scan, data_type: LaserScan, clearing: true, marking: true, max_obstacle_height: 2.0,
          min_obstacle_height: 0.0, obstacle_max_range: 2.5, obstacle_min_range: 0.0, raytrace_max_range: 3.0, raytrace_min_range: 0.0,
          inf_is_valid: false}
      hauts_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: hauts
        hauts: {topic: /ma64/obstacles_hauts, data_type: LaserScan, clearing: true, marking: true, min_obstacle_height: -0.1,
          max_obstacle_height: 2.0, obstacle_max_range: 2.4, raytrace_max_range: 2.5, inf_is_valid: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', inflation_radius: 0.8, cost_scaling_factor: 1.0}
      keepout_filter: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true, filter_info_topic: /costmap_filter_info,
        transform_tolerance: 0.5}
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      cost_travel_multiplier: 5.0
      use_final_approach_orientation: false
      smoother: {max_iterations: 1000, w_smooth: 0.5, w_data: 0.2, tolerance: 1.0e-10}
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    drive_on_heading: {plugin: 'nav2_behaviors::DriveOnHeading'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    max_velocity: [0.25, 0.0, 0.8]
    min_velocity: [-0.15, 0.0, -0.8]
    max_decel: [-1.5, 0.0, -2.5]
    max_accel: [1.0, 0.0, 2.0]
    odom_topic: /botwheel_explorer/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 0.5
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint,
      time_before_collision: 1.2, simulation_time_step: 0.1, min_points: 6, visualize: true, enabled: true}
    observation_sources: [scan]
    scan: {type: scan, topic: /scan_ma64, min_height: 0.15, max_height: 2.0, enabled: true}
    enable_stamped_cmd_vel: false
smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: 'nav2_smoother::SimpleSmoother', tolerance: 1.0e-10, max_its: 1000, do_refinement: true}
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 200}
map_saver:
  ros__parameters: {save_map_timeout: 5.0, free_thresh_default: 0.25, occupied_thresh_default: 0.65, map_subscribe_transient_local: true}
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    max_retries: 3
    base_frame: base_footprint
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [simple_charging_dock]
    simple_charging_dock: {plugin: 'opennav_docking::SimpleChargingDock', docking_threshold: 0.05, staging_x_offset: -0.7,
      use_external_detection_pose: false, use_battery_status: false, use_stall_detection: false}
    enable_stamped_cmd_vel: false
